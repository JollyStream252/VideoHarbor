name: Build VideoHarbor 1.2 for Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'video_harbor.py'
      - 'requirements.txt'
      - 'test_video_harbor.py'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Verify application files
        shell: pwsh
        run: |
          foreach ($path in @('video_harbor.py', 'test_video_harbor.py', 'requirements.txt', 'assets/VideoHarbor.ico')) {
            if (!(Test-Path $path)) { throw "Missing required build file: $path" }
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run automated tests
        shell: pwsh
        run: python -m unittest -v test_video_harbor.py

      - name: Build VideoHarbor.exe
        shell: pwsh
        run: |
          $extra = @()
          python -c "import yt_dlp_ejs" 2>$null
          if ($LASTEXITCODE -eq 0) { $extra = @('--collect-all', 'yt_dlp_ejs') }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name VideoHarbor --icon "assets/VideoHarbor.ico" --add-data "assets;assets" --collect-all yt_dlp @extra video_harbor.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: VideoHarbor-1.2-Windows
          path: dist/VideoHarbor.exe
          if-no-files-found: error
          retention-days: 30
